<!DOCTYPE html>
<html lang="en">

<head>
    <title>AMS Login Forum</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--===============================================================================================-->
    <link rel="icon" type="image/png" href="images/icons/favicon.ico" />
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="fonts/iconic/css/material-design-iconic-font.min.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="vendor/animate/animate.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="vendor/css-hamburgers/hamburgers.min.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="vendor/animsition/css/animsition.min.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="vendor/select2/select2.min.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="vendor/daterangepicker/daterangepicker.css">
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="css/util.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <!--===============================================================================================-->
</head>

<body>

    <div class="limiter">
        <div class="logo"> <img src="../images/icons/Nablle.svg" class="img-fluid" alt=""> </div>
        <div class="container-login100">
            <div class="wrap-login100">
                <form class="login100-form validate-form" id="form">
                    <span class="login100-form-title p-b-20">
						<img src="../images/icons/DL Logo.svg" class="img-fluid" alt="">
					</span>
                    <div class="wrap-input100 validate-input" data-validate="Valid email is: example@mail.com">
                        <input class="input100" type="text" id="email" name="email" required>
                        <span class="focus-input100 email" data-placeholder="Email"></span>
                    </div>
                    <div class="wrap-validate" style="display: none;">
                        <span class="focus">
						Enter your email
						</span>
                    </div>
                    <div class="wrap-input100 validate-input" data-validate="Enter password">
                        <span class="btn-show-pass">	
							<i class="zmdi zmdi-eye"></i>
						</span>
                        <input class="input100" type="password" name="password" id="password" required>
                        <span class="focus-input100 password" data-placeholder="Password"></span>
                    </div>
                    <div class="wrap-validate1" style="display: none;">
                        <span class="focus1">
						Enter Password
						</span>
                    </div>
                    <div class="container-login100-form-btn">
                        <div class="wrap-login100-form-btn">
                            <div class="login100-form-bgbtn"></div>
                            <button class="login100-form-btn">
								Sign In
							</button>
                        </div>
                    </div>

                </form>
                <div class="container-workspace-form-btn" >
                    <div class="wrap-login100-form-btn" style="border-radius: 8px !important;">
                        <div class="login100-form-bgbtn"></div>
                        <a href="url.html" class="login100-form-btn" style="background-color: #eb1f29; color: white;">
                            Change Workspace?
                        </a>
                    </div>
                </div>
                <!-- <a class="btn btn-light " href="url.html" style="font-size: 14px ">Change Workspace?</a> -->
            </div>
        </div>
    </div>



    <!--===============================================================================================-->
    <script src="vendor/jquery/jquery-3.2.1.min.js"></script>
    <!--===============================================================================================-->
    <script src="vendor/animsition/js/animsition.min.js"></script>
    <!--===============================================================================================-->
    <script src="vendor/bootstrap/js/popper.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.min.js"></script>
    <!--===============================================================================================-->
    <script src="vendor/select2/select2.min.js"></script>
    <!--===============================================================================================-->
    <script src="vendor/daterangepicker/moment.min.js"></script>
    <script src="vendor/daterangepicker/daterangepicker.js"></script>
    <!--===============================================================================================-->
    <script src="vendor/countdowntime/countdowntime.js"></script>
    <!--===============================================================================================-->
    <script src="js/jquery.min.js"></script>
    <script src="js/main2.js"></script>
    <script src="js/script.js"></script>


</body>

</html>
